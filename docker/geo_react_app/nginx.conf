server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side paths (/overview, /data-quality, ...); an unknown
    # path must serve index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable; index.html must always be revalidated.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
