# Runtime-only definition of geo_api_311 inside the FastAPI image.
# The repository environment.yml also lists pytest/ruff/tox/mypy and the unused
# pandas/geopandas stack; none of them are needed by the running API.
name: geo_api_311
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - fastapi>=0.110
  - uvicorn>=0.29
  - pydantic>=2.0.0
  - python-dotenv>=1.0
  - sqlalchemy>=2.0
  - greenlet>=3.0
  - sqlmodel>=0.0.22
  - asyncpg>=0.29
  - httpx>=0.27
  - python-multipart>=0.0.9
