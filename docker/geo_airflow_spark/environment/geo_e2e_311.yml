# Runtime-only definition of the geo_e2e_311 environment inside the image.
# The repository environment.yml additionally carries pytest/ruff/tox/mypy and IDE helpers,
# which are deliberately not installed into the production image.
name: geo_e2e_311
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pydantic>=2.0.0
  - psutil>=5.9.0
  - pip:
      - apache-airflow==3.3.2
      - apache-airflow-providers-standard==1.19.0
      - pendulum==3.2.0
