version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: geo_rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: geo_mq_admin
      RABBITMQ_DEFAULT_PASS: geo_mq_admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  rabbitmq_data:
