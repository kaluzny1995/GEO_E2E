# Self-contained GEO E2E stack — four images, no host conda, no host source bind mounts.
# The only host mount is the GEO_Download/data folder (GEO_DATA_DIR), shared by Airflow and Spark.
# GEO_API reads the CSV metadata from Supabase, which GEO_ETL publishes from the Spark side.
# GEO_Visual reads dashboard views directly from Supabase (read-only), not through GEO_API.
#
#   geo_airflow_spark  Airflow 3.3.2 + Spark 3.5.5 + Anaconda + GEO_E2E/GEO_Download/GEO_ETL
#   geo_fastapi        GEO_API + Anaconda (geo_api_311)
#   geo_react_app      compiled GEO_APP served by nginx
#   geo_streamlit      GEO_Visual Streamlit dashboard + Anaconda (geo_visual_311)
#
# Before `docker compose up`, run `./up.sh -d` (or `./check.sh`): it verifies that all six
# sibling repositories are present and that the five SUPABASE_DB_* values are filled in .env
# (see .env.example). Airflow defaults to airflow_admin / airflow_admin.
# Rebuild after source changes with `docker compose build` or `docker compose up -d --build`.

name: geo_e2e

# Keep container logs bounded. The Spark master healthcheck and the DAG processor log
# continuously, so an unbounded json-file log can grow by hundreds of MB per week.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# A hard cgroup limit is the important safety net: without it a runaway Airflow task or
# PySpark driver can consume all host RAM and freeze the machine before the kernel OOM
# killer gets a chance to act. memswap_limit == mem_limit disables container swap, so
# the kernel cannot thrash the host swapfile either. oom_score_adj makes the containers
# the preferred OOM victim instead of the desktop session.
x-airflow-spark-image: &airflow-spark-image
  image: geo_airflow_spark:latest
  mem_limit: ${AIRFLOW_MEM_LIMIT:-1g}
  memswap_limit: ${AIRFLOW_MEM_LIMIT:-1g}
  oom_score_adj: 500
  logging: *default-logging

x-airflow-common: &airflow-common
  <<: *airflow-spark-image
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DAGS_FOLDER: /opt/geo/GEO_E2E
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # LocalExecutor spawns `parallelism` worker processes in the scheduler container.
    # The Airflow default is 32 Python interpreters; on a laptop this is needless
    # overhead. The pools cap real concurrency at 3 downloads + 2 ETL jobs, so 8
    # workers is plenty and leaves headroom for the scheduler itself.
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-8}
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: ${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-6}
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: ${AIRFLOW_MAX_ACTIVE_RUNS_PER_DAG:-1}
    # Create DAGs unpaused on first parse — no manual unpause in the UI needed.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    # Supabase Postgres is the metadata DB. The SQLAlchemy URL pins search_path to
    # AIRFLOW_DB_SCHEMA so every Airflow table lands in `geo_airflow`; airflow-init creates
    # that schema before the migration. The password travels in PGPASSWORD (libpq), never
    # in the URL, and sslmode=require because Supabase terminates TLS on the pooler.
    AIRFLOW_DB_SCHEMA: ${AIRFLOW_DB_SCHEMA:-geo_airflow}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${SUPABASE_DB_USER:?Set SUPABASE_DB_USER in .env}@${SUPABASE_DB_HOST:?Set SUPABASE_DB_HOST in .env}:${SUPABASE_DB_PORT:?Set SUPABASE_DB_PORT in .env}/${SUPABASE_DB_NAME:?Set SUPABASE_DB_NAME in .env}?sslmode=require&options=-c%20search_path%3D${AIRFLOW_DB_SCHEMA:-geo_airflow}
    PGPASSWORD: ${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in .env}
    # Also passed to the task subprocesses: GEO_ETL/GEO_API read the same five names.
    SUPABASE_DB_USER: ${SUPABASE_DB_USER:?Set SUPABASE_DB_USER in .env}
    SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in .env}
    SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:?Set SUPABASE_DB_HOST in .env}
    SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:?Set SUPABASE_DB_PORT in .env}
    SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:?Set SUPABASE_DB_NAME in .env}
    AIRFLOW__API__HOST: 0.0.0.0
    AIRFLOW__API__PORT: "8090"
    AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_HOST_PORT:-8090}
    # Internal execution API address: scheduler/task supervisor reach the API server by
    # its Compose service name, not localhost.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8090/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-geo_e2e_dev_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_HOME: /opt/airflow
    # Do not set HOME here: the Airflow console script resolves its packages through the
    # image's /home/airflow user-site. AIRFLOW_HOME alone pins data/logs to the volume.
    CONDA_ROOT: /opt/conda
    GEO_DOCKER: "1"
    # UID the Airflow containers run as. setup.sh writes the host user's UID here so files
    # written into the bind-mounted data folder stay owned by that user; airflow-init runs
    # as root and uses the same value when it prepares the Airflow home volume.
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    # Airflow resolves the runtime user from the environment (the host UID has no passwd
    # entry inside the image). Without these, CLI commands fail with "no username".
    USER: airflow
    LOGNAME: airflow
    # GEO_ETL's Spark driver connects to the master by Compose DNS name.
    SPARK_MASTER_URL: spark://geo-spark-master:7078
    # Driver/executor memory caps read by GEO_ETL's AppConfig. A driver runs inside the
    # scheduler container for every ETL task; keep this small so the scheduler memory
    # limit below is a real ceiling.
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
    SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-1g}
    SPARK_EXECUTOR_CORES: ${SPARK_EXECUTOR_CORES:-1}
    SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-8}
    SPARK_MAX_RESULT_SIZE: ${SPARK_MAX_RESULT_SIZE:-256m}
  volumes:
    - airflow_data:/opt/airflow
    # The host data folder is the single source of truth for the host, Airflow and Spark.
    # A bind mount (not a named volume) keeps the local GEO_Download/data folder in sync
    # with what the containers read and write.
    - "${GEO_DATA_DIR:?Set GEO_DATA_DIR in .env}:/opt/geo/GEO_Download/data"
  # Refresh this container's in-image .env files from Compose, then run Airflow.
  entrypoint: ["/opt/geo/bin/airflow-entrypoint.sh"]
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - geo_network

services:
  # airflow-init is the builder for the shared geo_airflow_spark image. The other Airflow
  # and Spark services reference the same image (one build, not one per service).
  airflow-init:
    <<: *airflow-common
    mem_limit: ${AIRFLOW_INIT_MEM_LIMIT:-2g}
    memswap_limit: ${AIRFLOW_INIT_MEM_LIMIT:-2g}
    build:
      context: ..
      dockerfile: GEO_E2E/docker/geo_airflow_spark/Dockerfile
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        # The host data folder is bind-mounted here. Docker creates a missing host path as
        # root, so make sure the runtime user owns the mount point before downloads start.
        mkdir -p /opt/geo/GEO_Download/data
        chown "${AIRFLOW_UID:-50000}:0" /opt/geo/GEO_Download/data
        # Write .env from the Compose-provided credentials (no secrets in image layers).
        /opt/geo/bin/refresh-env.sh
        # Create the Supabase schema first — the connection pins search_path to it, and
        # Postgres has no DDL for "create if missing" inside Airflow's own migration.
        python /opt/geo/GEO_E2E/docker/airflow/create_schema.py
        /entrypoint airflow version
        # Seed the concurrency pools from config.json (`dag.pool_slots`; idempotent).
        unset _AIRFLOW_DB_MIGRATE _AIRFLOW_WWW_USER_CREATE
        python /opt/geo/GEO_E2E/docker/airflow/seed_pools.py
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow_admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow_admin}
    user: "0:0"
    restart: "no"

  airflow-dag-processor:
    <<: *airflow-common
    mem_limit: ${AIRFLOW_DAG_PROCESSOR_MEM_LIMIT:-1g}
    memswap_limit: ${AIRFLOW_DAG_PROCESSOR_MEM_LIMIT:-1g}
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor
    # The DAG processor registers a DagProcessorJob row; `jobs check` reports healthy only
    # while that job is alive, so a wedged parser is restarted instead of silently stalling
    # DAG discovery. Same probe shape as the scheduler below.
    healthcheck:
      test: ["CMD-SHELL", "python -m airflow jobs check --job-type DagProcessorJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    # The scheduler container also hosts every LocalExecutor task and its PySpark
    # driver, so it gets the largest Airflow budget.
    mem_limit: ${AIRFLOW_SCHEDULER_MEM_LIMIT:-4g}
    memswap_limit: ${AIRFLOW_SCHEDULER_MEM_LIMIT:-4g}
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
      geo-spark-master:
        condition: service_healthy
      geo-spark-worker-1:
        condition: service_started
      geo-spark-worker-2:
        condition: service_started
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "python -m airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-api-server:
    <<: *airflow-common
    mem_limit: ${AIRFLOW_API_MEM_LIMIT:-1g}
    memswap_limit: ${AIRFLOW_API_MEM_LIMIT:-1g}
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    ports:
      - "${AIRFLOW_HOST_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8090/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # One-shot: make sure a metadata DB that already contains geo_pipeline leaves it active
  # after startup. On a fresh Supabase schema `dags_are_paused_at_creation=false` already
  # creates it unpaused; this also repairs an earlier manually-paused DAG.
  airflow-dag-activate:
    <<: *airflow-common
    depends_on:
      airflow-dag-processor:
        condition: service_started
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        for _ in $(seq 1 60); do
            # `python -m airflow` rather than the console script: this service bypasses
            # /entrypoint, so HOME is not /home/airflow and the console script cannot
            # resolve the user-site packages when the container runs as the host UID.
            if python -m airflow dags unpause geo_pipeline 2>/dev/null; then
                echo "geo_pipeline is active"
                exit 0
            fi
            sleep 5
        done
        echo "geo_pipeline was not discovered within 5 minutes" >&2
        exit 1
    restart: "no"

  airflow-cli:
    <<: *airflow-common
    profiles: [debug]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    # `docker compose run --rm airflow-cli dags list` -> `airflow dags list`.
    # `python -m airflow` keeps the CLI working when this service bypasses /entrypoint
    # and the container runs as the host UID (HOME is not /home/airflow).
    entrypoint: ["python", "-m", "airflow"]
    command: ["--help"]

  geo-spark-master:
    <<: *airflow-spark-image
    mem_limit: ${SPARK_MASTER_MEM_LIMIT:-1g}
    memswap_limit: ${SPARK_MASTER_MEM_LIMIT:-1g}
    user: "50000:0"
    environment:
      SPARK_MASTER_HOST: geo-spark-master
      SPARK_MASTER_PORT: "7078"
      SPARK_MASTER_WEBUI_PORT: "8083"
    # Bypass Airflow's /entrypoint: this image also hosts the Spark master.
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master"]
    ports:
      - "${SPARK_MASTER_PORT_HOST:-7078}:7078"
      - "${SPARK_MASTER_UI_HOST_PORT:-8083}:8083"
    volumes:
      - "${GEO_DATA_DIR:?Set GEO_DATA_DIR in .env}:/opt/geo/GEO_Download/data:ro"
    networks:
      - geo_network
    healthcheck:
      # The master binds SPARK_MASTER_HOST (geo-spark-master), not loopback.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/geo-spark-master/7078'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  geo-spark-worker-1:
    <<: *airflow-spark-image
    mem_limit: ${SPARK_WORKER_MEM_LIMIT:-3g}
    memswap_limit: ${SPARK_WORKER_MEM_LIMIT:-3g}
    user: "50000:0"
    environment:
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_WEBUI_PORT: "8081"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "spark://geo-spark-master:7078"]
    depends_on:
      geo-spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER_1_UI_HOST_PORT:-8084}:8081"
    volumes:
      - "${GEO_DATA_DIR:?Set GEO_DATA_DIR in .env}:/opt/geo/GEO_Download/data:ro"
    networks:
      - geo_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  geo-spark-worker-2:
    <<: *airflow-spark-image
    mem_limit: ${SPARK_WORKER_MEM_LIMIT:-3g}
    memswap_limit: ${SPARK_WORKER_MEM_LIMIT:-3g}
    user: "50000:0"
    environment:
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_WEBUI_PORT: "8081"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "spark://geo-spark-master:7078"]
    depends_on:
      geo-spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER_2_UI_HOST_PORT:-8085}:8081"
    volumes:
      - "${GEO_DATA_DIR:?Set GEO_DATA_DIR in .env}:/opt/geo/GEO_Download/data:ro"
    networks:
      - geo_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  geo_fastapi:
    image: geo_fastapi:latest
    mem_limit: ${GEO_API_MEM_LIMIT:-1g}
    memswap_limit: ${GEO_API_MEM_LIMIT:-1g}
    oom_score_adj: 500
    logging: *default-logging
    build:
      context: ..
      dockerfile: GEO_E2E/docker/geo_fastapi/Dockerfile
    environment:
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:?Set SUPABASE_DB_USER in .env}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in .env}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:?Set SUPABASE_DB_HOST in .env}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:?Set SUPABASE_DB_PORT in .env}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:?Set SUPABASE_DB_NAME in .env}
    ports:
      - "${GEO_API_HOST_PORT:-8000}:8000"
    volumes:
      - geo_api_logs:/opt/geo/GEO_API/logs
    networks:
      - geo_network
    restart: unless-stopped

  geo_react_app:
    image: geo_react_app:latest
    mem_limit: ${GEO_APP_MEM_LIMIT:-128m}
    memswap_limit: ${GEO_APP_MEM_LIMIT:-128m}
    oom_score_adj: 500
    logging: *default-logging
    build:
      context: ..
      dockerfile: GEO_E2E/docker/geo_react_app/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    depends_on:
      geo_fastapi:
        condition: service_healthy
    ports:
      - "${GEO_APP_HOST_PORT:-3000}:80"
    networks:
      - geo_network
    restart: unless-stopped

  geo_streamlit:
    image: geo_streamlit:latest
    mem_limit: ${GEO_VISUAL_MEM_LIMIT:-1g}
    memswap_limit: ${GEO_VISUAL_MEM_LIMIT:-1g}
    oom_score_adj: 500
    logging: *default-logging
    build:
      context: ..
      dockerfile: GEO_E2E/docker/geo_streamlit/Dockerfile
    environment:
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:?Set SUPABASE_DB_USER in .env}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in .env}
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:?Set SUPABASE_DB_HOST in .env}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:?Set SUPABASE_DB_PORT in .env}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:?Set SUPABASE_DB_NAME in .env}
    ports:
      - "${GEO_VISUAL_HOST_PORT:-8501}:8501"
    networks:
      - geo_network
    restart: unless-stopped
    # Reads the dashboard views directly from Supabase; deliberately does not depend on
    # geo_fastapi (GEO_Visual is not an API client).

volumes:
  airflow_data:
  # geo_data is intentionally no longer declared: the host GEO_Download/data folder is
  # bind-mounted into Airflow and Spark above. The old named volume is left untouched
  # (not deleted), so its files remain available if they are ever needed.
  geo_api_logs:

networks:
  geo_network:
    driver: bridge
