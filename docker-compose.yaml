x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
    args:
      CONDA_ROOT: ${CONDA_ROOT:?Set CONDA_ROOT in .env.local (run ./setup.sh)}
  image: geo_airflow:3.3.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__DAGS_FOLDER: ${GEO_ROOT:?Set GEO_ROOT in .env.local (run ./setup.sh)}/GEO_E2E
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Create DAGs unpaused on first parse — no manual unpause in the UI needed
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@127.0.0.1:5472/airflow
    AIRFLOW__API__PORT: "8090"
    AIRFLOW__API__BASE_URL: http://localhost:8090
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8090/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-geo_e2e_dev_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_HOME: /opt/airflow
    HOME: /opt/airflow
    CONDA_ROOT: ${CONDA_ROOT:?Set CONDA_ROOT in .env.local (run ./setup.sh)}
  volumes:
    # Mounted at the same absolute path inside the container so conda env shebangs
    # and sibling-project paths keep resolving — the values live only in .env.local (not in git)
    - ${GEO_ROOT:?Set GEO_ROOT in .env.local (run ./setup.sh)}:${GEO_ROOT:?Set GEO_ROOT in .env.local (run ./setup.sh)}
    - ${CONDA_ROOT:?Set CONDA_ROOT in .env.local (run ./setup.sh)}:${CONDA_ROOT:?Set CONDA_ROOT in .env.local (run ./setup.sh)}
    - airflow_data:/opt/airflow
  user: "${AIRFLOW_UID:-50000}:0"
  network_mode: host
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:16
    container_name: geo_airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5472:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        /entrypoint airflow version
        # Seed the concurrency pools from config.json (`dag.pool_slots`; idempotent — re-running
        # docker compose up resets them to the configured slot counts). The script invokes the
        # CLI through /entrypoint; skip the env-triggered migrate/user steps on those extra calls
        # — they already ran above.
        unset _AIRFLOW_DB_MIGRATE _AIRFLOW_WWW_USER_CREATE
        python "${GEO_ROOT}/GEO_E2E/docker/airflow/seed_pools.py"
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:?Set _AIRFLOW_WWW_USER_USERNAME in .env.local (run ./setup.sh)}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:?Set _AIRFLOW_WWW_USER_PASSWORD in .env.local (run ./setup.sh)}
    user: "0:0"

  airflow-dag-processor:
    <<: *airflow-common
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: always
    # `python -m airflow` (not the `airflow` console script): healthchecks bypass /entrypoint,
    # so HOME stays /opt/airflow and the script's interpreter can't resolve the image's
    # /home/airflow/.local install — PATH `python` resolves that prefix via pyvenv.cfg.
    healthcheck:
      test: ["CMD-SHELL", "python -m airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-api-server:
    <<: *airflow-common
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8090/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  airflow-cli:
    <<: *airflow-common
    profiles: [debug]
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    command:
      - bash
      - -c
      - airflow

  geo_spark_master:
    build: ../GEO_ETL/spark_cluster_image
    container_name: geo_spark_master
    hostname: geo-spark-master
    ports:
      - "8083:8083"
      - "7078:7078"
    environment:
      SPARK_MASTER_HOST: geo-spark-master
      SPARK_MASTER_WEBUI_PORT: "8083"
      SPARK_MASTER_PORT: "7078"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - geo_network
    volumes:
      - ${GEO_DATA_DIR}:${GEO_DATA_DIR}:ro
    restart: always

  geo_spark_worker_1:
    build: ../GEO_ETL/spark_cluster_image
    container_name: geo_spark_worker_1
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_WEBUI_PORT: "8084"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://geo-spark-master:7078
    depends_on:
      - geo_spark_master
    networks:
      - geo_network
    volumes:
      - ${GEO_DATA_DIR}:${GEO_DATA_DIR}:ro
    restart: always

  geo_spark_worker_2:
    build: ../GEO_ETL/spark_cluster_image
    container_name: geo_spark_worker_2
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_WEBUI_PORT: "8085"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://geo-spark-master:7078
    depends_on:
      - geo_spark_master
    networks:
      - geo_network
    volumes:
      - ${GEO_DATA_DIR}:${GEO_DATA_DIR}:ro
    restart: always

volumes:
  airflow_data:
  postgres_data:

networks:
  geo_network:
    driver: bridge
