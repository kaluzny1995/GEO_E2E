name: geo_e2e_311
channels:
  - defaults
dependencies:
  - python=3.11
  - pydantic>=2.0.0
  - pytest>=7.0.0
  - psutil>=5.9.0
  - pip
  - pip:
      - ruff>=0.6
      - tox>=4.0
      - mypy>=1.10
