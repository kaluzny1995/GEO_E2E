[tox]
envlist = lint, py311
minversion = 4.0

[testenv]
skip_install = true
deps =
    pydantic>=2.0.0
    psutil>=5.9.0
    pytest>=7.0.0
commands =
    pytest {posargs}

[testenv:lint]
skip_install = true
deps =
    ruff>=0.6
commands =
    ruff check --output-format=concise .

[testenv:format]
description = Check formatting (run `tox -e format-fix` to apply)
skip_install = true
deps =
    ruff>=0.6
commands =
    ruff format --check .

[testenv:format-fix]
skip_install = true
deps =
    ruff>=0.6
commands =
    ruff format .

[testenv:typecheck]
skip_install = true
deps =
    mypy>=1.10
    types-psutil
    pydantic>=2.0.0
    psutil>=5.9.0
    # docker/geo_airflow_spark/create_schema.py imports it (mypy checks the docker/ tree)
    sqlalchemy>=2.0.0
commands =
    mypy

[testenv:warnings]
description = Run the test suite with Python warnings turned into errors
skip_install = true
deps =
    pydantic>=2.0.0
    psutil>=5.9.0
    pytest>=7.0.0
commands =
    pytest -W error::DeprecationWarning {posargs}
